name: Docker image (web)

on:
  release:
    types: [published]

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Login su GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Il runner ubuntu-latest è amd64: QEMU serve per emulare arm64 durante
      # la build, altrimenti buildx potrebbe produrre solo la variante amd64
      # e "docker pull" su Apple Silicon fallirebbe con "no matching manifest".
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Metadati immagine (tag della release + latest)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/helmutsti/youtubecatalog-web
          tags: |
            type=raw,value=${{ github.event.release.tag_name }}
            type=raw,value=latest

      - name: Build e push multi-piattaforma (amd64 + arm64), solo Dockerfile.web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.web
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
