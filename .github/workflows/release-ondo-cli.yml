name: Package ondo-cli

on:
  release:
    types: [published]

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install workspace deps (smoke test)
        run: npm ci

      - name: Smoke test — ondo-cli gira nel monorepo prima di impacchettarlo
        run: node packages/ondo-cli/bin/ondo.js --help

      - name: Build pacchetto standalone
        run: node scripts/package-ondo-cli.mjs "${{ github.event.release.tag_name }}"

      - name: Crea tarball (.tgz), installabile con "npm install -g <url>"
        run: |
          # La cartella dentro il tar deve chiamarsi "package" (convenzione npm:
          # è così che sono fatti i tarball di `npm pack`/`npm publish`) perché
          # `npm install -g <url>.tgz` sappia stripparla correttamente in fase
          # di estrazione — con un nome diverso il pacchetto non si installa.
          mv dist/ondo-cli dist/package
          tar czf "ondo-cli-${{ github.event.release.tag_name }}.tgz" -C dist package

      - name: Allega alla release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: ondo-cli-${{ github.event.release.tag_name }}.tgz
