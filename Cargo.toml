[workspace]
resolver = "2"
members = ["ondo", "ondo-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"

# Dipendenze deliberatamente ridotte all'osso: serde/serde_json servono per
# leggere l'output `-J` di yt-dlp e per il protocollo del sentinel. Tutto il
# resto (parallelismo, processi, filesystem, scrittura atomica) è std.
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
