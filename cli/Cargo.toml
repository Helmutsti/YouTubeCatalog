[package]
name = "ondo-cli"
description = "Menu a frecce sopra la libreria: cerca, libreria, download rapido, impostazioni"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "ondo"
path = "src/main.rs"

[dependencies]
ondo = { path = "../ondo-core" }

# Menu navigabili con le FRECCE, non comandi digitati.
dialoguer = { version = "0.11", default-features = false, features = ["fuzzy-select"] }
console = "0.15"

