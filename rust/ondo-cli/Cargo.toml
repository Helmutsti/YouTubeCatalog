[package]
name = "ondo-cli"
description = "Menu a frecce per il catalogo video locale (porting da packages/cli/cli.js)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "ondo"
path = "src/main.rs"

[dependencies]
ondo-core = { path = "../ondo-core" }
serde_json.workspace = true

# Equivalente Rust di `@inquirer/prompts`: menu navigabili con le FRECCE, che è un
# requisito esplicito del progetto ("niente comandi digitati", vedi progetto.md).
# Sta qui e non in ondo-core: il core non ha né deve avere dipendenze di interfaccia.
dialoguer = { version = "0.11", default-features = false, features = ["fuzzy-select"] }
console = "0.15"
